name: VVV static checks

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate Clausewitz source and localisation
        run: python tools/validate.py
      - name: Exercise combat rules
        run: python -m unittest discover -s tests -v
      - name: Run battlefield demonstration
        run: python -m tools.tactics
